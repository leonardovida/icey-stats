[project]
name = "icey-stats"
version = "0.1.0"
description = "Anonymous usage statistics for the Icey macOS app, stored in DuckDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icey_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
